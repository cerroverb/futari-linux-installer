name: Deploy to GitHub Pages

# The Linux builds are not in this repository: they are assets (futari-linux-aarch64.tar.gz and
# futari-linux-x86_64.tar.gz, made by tools/linux/package.sh --release) of a release of the futari-linux repository of
# the same owner. Each deployment downloads them, extracts them into release/<arch>/, checks every file against
# release/manifest.json and publishes the page with them. Run it by hand (Actions > Deploy to GitHub Pages > Run
# workflow) after publishing a new release there.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release of futari-linux to take the builds from (empty for the latest)
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the Linux builds of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository_owner }}/futari-linux
        run: |
          mkdir -p downloads
          gh release download $TAG --repo "$REPO" --pattern 'futari-linux-*.tar.gz' --dir downloads --clobber
          for arch in aarch64 x86_64; do
            if [ -f "downloads/futari-linux-$arch.tar.gz" ]; then
              mkdir -p "release/$arch"
              tar -xzf "downloads/futari-linux-$arch.tar.gz" -C "release/$arch" --strip-components=1
            fi
          done

      - name: Check them against the list of builds
        run: node tools/linux_manifest.mjs check

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html app.js worker.js sw.js icons renut_shader_common.h lib release _site/
          mkdir _site/wasm
          cp wasm/dxc_web.mjs wasm/dxc_web.wasm wasm/lzx.mjs wasm/lzx.wasm wasm/renut_hlsl.mjs wasm/renut_hlsl.wasm _site/wasm/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
